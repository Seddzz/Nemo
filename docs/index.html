<style>
:root {
    --bg: 1 4 5;
    --soft: 7 13 16;
    --surface: 11 19 23;
    --surface2: 16 26 31;
    --line: 24 36 42;
    --linesoft: 15 25 30;
    --ink: 233 240 243;
    --inksoft: 148 163 170;
    --inkdim: 98 113 120;
    --accent: 200 255 0;
    --accentink: 200 255 0;
}
html.light {
    --bg: 255 255 255;
    --soft: 249 251 249;
    --surface: 242 246 240;
    --surface2: 232 238 228;
    --line: 219 227 214;
    --linesoft: 233 239 229;
    --ink: 15 20 12;
    --inksoft: 74 84 70;
    --inkdim: 140 150 136;
    --accent: 200 255 0;
    --accentink: 90 120 0;
}

html {
    scroll-behavior: smooth;
    scroll-padding-top: 8rem;
    overscroll-behavior: none;
    overscroll-behavior-y: none;
}
body {
    background-color: rgb(var(--bg));
    color: rgb(var(--ink));
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
    overscroll-behavior-y: none;
}

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgb(var(--line)); border-radius: 9999px; }
::-webkit-scrollbar-thumb:hover { background: rgb(var(--inkdim)); }

/* every icon is lime, per spec */
.icon, svg.lucide { color: #C8FF00; width: 1em; height: 1em; display: inline-block; vertical-align: -0.125em; flex-shrink: 0; }
svg.lucide { stroke: currentColor; }

/* sidebar item */
.navitem {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 12px; border-radius: 8px;
    color: rgb(var(--inksoft)); font-size: 14px;
    transition: background-color .12s, color .12s;
    width: 100%; text-align: left;
}
.navitem:hover { color: rgb(var(--ink)); }
.navitem.active {
    background: rgba(200,255,0,0.12);
    color: #C8FF00;
    font-weight: 500;
}
.navitem.active span:not(.navico) { color: #C8FF00; }

.navgroup-title {
    display: flex; align-items: center; gap: 8px;
    padding: 0 12px; margin-bottom: 8px;
    font-size: 13.5px; font-weight: 600; color: rgb(var(--ink));
}

/* tabs */
.tablink {
    position: relative; display: inline-flex; align-items: center; gap: 8px;
    padding: 12px 4px; font-size: 14px; color: rgb(var(--inksoft));
    border-bottom: 2px solid transparent; margin-bottom: -1px;
    transition: color .12s, border-color .12s;
}
.tablink:hover { color: rgb(var(--ink)); }
.tablink.active { color: #C8FF00; border-bottom-color: #C8FF00; font-weight: 500; }

/* prose */
.prose h2 { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; margin: 2.2rem 0 0.9rem; color: rgb(var(--ink)); }
.prose h3 { font-size: 18px; font-weight: 600; letter-spacing: -0.01em; margin: 1.8rem 0 0.7rem; color: rgb(var(--ink)); }
.prose p { color: rgb(var(--inksoft)); line-height: 1.75; margin-bottom: 1rem; font-size: 15px; }
.prose a { color: #C8FF00; text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
html.light .prose a { color: rgb(var(--accentink)); }
.prose a:hover { opacity: .85; }
.prose strong { color: rgb(var(--ink)); font-weight: 600; }
.prose ul { margin: 0 0 1rem; padding-left: 0; list-style: none; }
.prose ul li { color: rgb(var(--inksoft)); line-height: 1.75; font-size: 15px; padding-left: 1.35rem; position: relative; margin-bottom: 6px; }
.prose ul li::before { content: ""; position: absolute; left: 0.3rem; top: 0.72em; width: 5px; height: 5px; border-radius: 2px; background: #C8FF00; }
.prose code {
    font-family: 'JetBrains Mono', monospace; font-size: 12.5px;
    background: rgb(var(--surface)); border: 1px solid rgb(var(--linesoft));
    padding: 2px 6px; border-radius: 5px; color: rgb(var(--ink));
}

/* code block */
.codeblock { border: 1px solid rgb(var(--linesoft)); border-radius: 12px; overflow: hidden; background: rgb(var(--soft)); margin: 1.25rem 0; }
.codeblock .cb-head { display: flex; align-items: center; gap: 20px; padding: 0 14px; border-bottom: 1px solid rgb(var(--linesoft)); background: rgb(var(--bg)); }
.codeblock .cb-tab { padding: 12px 2px; font-size: 13px; color: rgb(var(--inkdim)); border-bottom: 2px solid transparent; margin-bottom: -1px; cursor: pointer; }
.codeblock .cb-tab.active { color: #C8FF00; border-bottom-color: #C8FF00; }
.codeblock .cb-actions { margin-left: auto; display: flex; align-items: center; gap: 4px; }
.codeblock .cb-actions button { padding: 5px; border-radius: 6px; }
.codeblock .cb-actions button:hover { background: rgb(var(--surface)); }
.codeblock .cb-body { display: flex; font-family: 'JetBrains Mono', monospace; font-size: 12.5px; line-height: 1.7; overflow-x: auto; }
.codeblock .cb-gutter { padding: 16px 0; text-align: right; color: rgb(var(--inkdim)); user-select: none; min-width: 52px; border-right: 1px solid rgb(var(--linesoft)); }
.codeblock .cb-gutter div { padding: 0 14px 0 8px; }
.codeblock .cb-code { padding: 16px 18px; white-space: pre; color: rgb(var(--ink)); flex: 1; }
.codeblock .tok-key { color: #c792ea; }
.codeblock .tok-str { color: #C8FF00; }
.codeblock .tok-com { color: rgb(var(--inkdim)); }
.codeblock .tok-fn { color: #82aaff; }

/* callout */
.callout { display: flex; gap: 12px; padding: 14px 16px; border-radius: 12px; font-size: 14px; border: 1px solid rgb(var(--linesoft)); background: rgb(var(--soft)); color: rgb(var(--inksoft)); }
.callout .icon, .callout svg.lucide { margin-top: 1px; }

/* card grid */
.card { border: 1px solid rgb(var(--linesoft)); border-radius: 12px; background: rgb(var(--soft)); padding: 16px; }
.card .cico { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; background: rgba(200,255,0,0.12); font-size: 16px; margin-bottom: 12px; }

/* table */
table.api { width: 100%; border-collapse: collapse; font-size: 14px; }
table.api th { text-align: left; padding: 10px 16px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: rgb(var(--inkdim)); border-bottom: 1px solid rgb(var(--linesoft)); font-weight: 600; }
table.api td { padding: 12px 16px; border-bottom: 1px solid rgb(var(--linesoft)); color: rgb(var(--inksoft)); }
table.api td:first-child { font-family: 'JetBrains Mono', monospace; color: #C8FF00; font-size: 12.5px; }
.method { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 5px; }
.method.post { background: rgba(200,255,0,0.14); color: #C8FF00; }
.method.get { background: rgba(96,165,250,0.14); color: #7cb0f5; }
.endpoint { font-family: 'JetBrains Mono', monospace; font-size: 13.5px; color: rgb(var(--ink)); }

/* toc */
.toc a { display: block; padding: 5px 0; font-size: 13.5px; color: rgb(var(--inksoft)); }
.toc a:hover { color: rgb(var(--ink)); }
.toc a.sub { padding-left: 20px; font-size: 13px; }
.toc a.active { color: #C8FF00; font-weight: 500; }

.menu-pop { position: absolute; top: calc(100% + 6px); right: 0; z-index: 50; min-width: 210px; background: rgb(var(--soft)); border: 1px solid rgb(var(--line)); border-radius: 12px; padding: 5px; box-shadow: 0 12px 32px rgba(0,0,0,.5); }
.menu-pop button { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 8px 10px; border-radius: 8px; font-size: 13.5px; color: rgb(var(--inksoft)); }
.menu-pop button:hover { background: rgb(var(--surface)); color: rgb(var(--ink)); }
[data-section] { scroll-margin-top: 8rem; }
</style>
</head>

<script>
/* ---------- icon helper (lucide) ---------- */
const LUCIDE = {
    code: 'code', doc: 'book', agent: 'hexagon', cookbook: 'book-open',
    panel: 'panel-left', lines: 'align-left', layers: 'layers', gauge: 'gauge',
    lock: 'lock', gear: 'settings', warn: 'triangle-alert', refresh: 'refresh-cw',
    branch: 'git-branch', history: 'history', chevron: 'chevron-right', chevrondown: 'chevron-down',
    list: 'list-ordered', copy: 'copy', search: 'search', sparkle: 'sparkles',
    moon: 'moon', sun: 'sun', up: 'arrow-up', terminal: 'terminal', box: 'box',
    db: 'database', info: 'info', expand: 'maximize-2', github: 'github'
};
const ic = (name, cls = '') => '<i data-lucide="' + (LUCIDE[name] || name) + '" class="' + cls + '"></i>';
const paintIcons = () => { if (window.lucide && lucide.createIcons) lucide.createIcons(); };

const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

const TOPNAV = [
    { label: 'Playground', goto: 'playground' },
    { label: 'Detection', goto: 'detection' },
    { label: 'CLI', goto: 'cli' },
    { label: 'Agent SDK', goto: 'mcp' },
    { label: 'Pricing', goto: 'limits' }
];

const TABS = [
    { id: 'docs', label: 'Docs', icon: 'doc' },
    { id: 'api', label: 'API Reference', icon: 'code' },
    { id: 'cli', label: 'CLI', icon: 'terminal' },
    { id: 'mcp', label: 'Agent SDK', icon: 'agent' },
    { id: 'cookbook', label: 'Cookbook', icon: 'cookbook' }
];

const NAV = [
    { group: 'API Guides', icon: 'code', items: [
        { id: 'api', label: 'Overview', icon: 'panel' },
        { id: 'extraction', label: 'Extraction', icon: 'lines' },
        { id: 'detection', label: 'Detection', icon: 'layers' },
        { id: 'checksums', label: 'Checksums', icon: 'gauge' },
        { id: 'ner', label: 'NER Model', icon: 'box' },
        { id: 'limits', label: 'Limits', icon: 'gauge' },
        { id: 'authentication', label: 'Authentication', icon: 'lock' },
        { id: 'parameters', label: 'Parameters', icon: 'gear' },
        { id: 'errors', label: 'Errors and Debugging', icon: 'warn' },
        { id: 'responses', label: 'Responses API', icon: 'refresh', chevron: true }
    ]},
    { group: 'Versioning', icon: 'branch', items: [
        { id: 'versioning', label: 'API Versioning', icon: 'branch' },
        { id: 'changelog', label: 'API Changelog', icon: 'history' }
    ]},
    { group: 'API Reference', icon: 'code', items: [
        { id: 'playground', label: 'Playground', chevron: true },
        { id: 'cli', label: 'CLI', chevron: true },
        { id: 'docker', label: 'Docker', chevron: true },
        { id: 'mcp', label: 'Agent SDK', chevron: true },
        { id: 'batch', label: 'Batch', chevron: true }
    ]}
];

const CODE_REQ = `// Definitions of subtypes are below
type Request = {
  // Either "messages" or "prompt" is required
  messages?: Message[];
  prompt?: string;

  // Detection pipeline
  detectors?: ("regex" | "checksum" | "ner")[];
  reversible?: boolean;

  // Optional TTL for the reversible mapping
  mapping_ttl_seconds?: number;
};`;

const CODE_CLI = `# Anonymize every PDF in a folder
$ anon ./contracts/*.pdf --out ./clean/ --mapping-out ./mappings/

# Restore a redacted file back to its original text
$ anon restore ./clean/contract.txt \\
    --mapping ./mappings/contract.json --out ./restored/`;

function codeBlock(tabs, activeIdx, code) {
    const head = tabs.map((t, i) => '<div class="cb-tab' + (i === activeIdx ? ' active' : '') + '">' + t + '</div>').join('');
    const lines = code.split('\n');
    const gutter = lines.map((_, i) => '<div>' + (i + 1) + '</div>').join('');
    return '<figure class="codeblock" data-code="' + encodeURIComponent(code) + '">' +
        '<figcaption class="cb-head">' + head +
        '<div class="cb-actions">' +
        '<button title="Info">' + ic('info', 'text-[15px]') + '</button>' +
        '<button class="cb-copy" title="Copy">' + ic('copy', 'text-[15px]') + '</button>' +
        '<button title="Expand">' + ic('expand', 'text-[15px]') + '</button>' +
        '</div></figcaption>' +
        '<div class="cb-body"><div class="cb-gutter">' + gutter + '</div>' +
        '<div class="cb-code">' + esc(code) + '</div></div></figure>';
}

const CONTENT = {
    api: {
        crumb: 'API Guides',
        title: 'API Reference',
        sub: "An overview of AnonShield's API",
        toc: [
            { id: 'openapi', label: 'OpenAPI specification', level: 0, active: true },
            { id: 'requests', label: 'Requests', level: 0 },
            { id: 'completions-format', label: 'Completions request format', level: 1 },
            { id: 'structured', label: 'Structured outputs', level: 1 },
            { id: 'plugins', label: 'Plugins', level: 1 },
            { id: 'headers', label: 'Headers', level: 1 },
            { id: 'prefill', label: 'Assistant prefill', level: 1 },
            { id: 'responses-sec', label: 'Responses', level: 0 },
            { id: 'completions-response', label: 'CompletionsResponse format', level: 1 },
            { id: 'finish-reason', label: 'Finish reason', level: 1 },
            { id: 'cost', label: 'Querying cost and stats', level: 1 }
        ],
        body: `
        <p>AnonShield's request and response schemas are deliberately small. At a high level, <strong>the same <code>Entity</code> shape flows through every endpoint</strong> — detection, redaction and restore all speak it — so you only need to learn one format.</p>

        <h2 id="openapi">OpenAPI specification</h2>
        <p>The complete AnonShield API is documented using the OpenAPI specification. You can access the specification in either YAML or JSON format:</p>
        <ul>
            <li><strong>YAML</strong>: <a href="#openapi" data-goto="api">https://localhost:8000/openapi.yaml</a></li>
            <li><strong>JSON</strong>: <a href="#openapi" data-goto="api">https://localhost:8000/openapi.json</a></li>
        </ul>
        <p>These specifications can be used with tools like <a href="#openapi" data-goto="api">Swagger UI</a>, <a href="#openapi" data-goto="api">Postman</a>, or any OpenAPI-compatible code generator to explore the API or generate client libraries.</p>

        <h2 id="requests">Requests</h2>
        <h3 id="completions-format">Completions request format</h3>
        <p>Below is a complete list of parameters for the <code>/anonymize</code> endpoint. Only <code>text</code> is required; every other field falls back to a sensible default.</p>
        ${codeBlock(['Request Schema', 'Response'], 0, CODE_REQ)}
        <p>Send a POST request with a JSON body, or upload a file with <code>multipart/form-data</code> for PDF ingestion. Authentication is always via the <code>X-API-Key</code> header.</p>

        <h2 id="responses-sec">Responses</h2>
        <p>Every response returns the redacted text, the stable placeholder mapping and the detected entities. Pass the <code>mapping_id</code> to <code>/restore</code> to recover the originals.</p>
        <div class="callout mt-2">${ic('info', 'text-[16px]')}<div><strong class="text-ink">Reversible by default.</strong> Mappings live in memory with a 15&nbsp;minute TTL and never touch disk unless you explicitly export them.</div></div>
        `
    },
    docs: {
        crumb: 'Getting Started',
        title: 'Introduction',
        sub: 'Redact PII locally, then put it back',
        toc: [{ id: 'install', label: 'Installation', level: 0 }, { id: 'first-call', label: 'Your first call', level: 0 }, { id: 'pipeline', label: 'The pipeline', level: 0 }],
        body: `
        <p><strong>AnonShield</strong> is a zero-trust, <strong>$0</strong> anonymizer for English documents. It strips personally identifiable information before the text ever reaches a model, then restores the exact original values on the way back.</p>
        <h2 id="install">Installation</h2>
        <p>Install the package with CPU-only PyTorch, or run the prebuilt container.</p>
        <div class="callout mt-2">${ic('terminal', 'text-[16px]')}<div><code>pip install -e ".[dev]"</code> — then <code>uvicorn anonymizer.api:app</code> to serve the API.</div></div>
        <h2 id="first-call">Your first call</h2>
        <p>POST some text to <code>/anonymize</code> and read the placeholders from <code>redacted_text</code>. That's the whole loop.</p>
        <h2 id="pipeline">The pipeline</h2>
        <p>Extraction preserves character offsets, detectors all return the same <code>Entity</code> type, and overlapping spans are resolved before rewriting. Because offsets survive the round trip, redaction is lossless.</p>
        `
    },
    extraction: {
        crumb: 'API Guides',
        title: 'Extraction',
        sub: 'Text and page offsets from PDFs',
        toc: [{ id: 'ex-1', label: 'Text-based PDFs', level: 0 }, { id: 'ex-2', label: 'Scanned documents', level: 0 }],
        body: `
        <p>Extraction converts a document into a list of pages with the raw text and the character offsets that map it back to the source.</p>
        <h2 id="ex-1">Text-based PDFs</h2>
        <p>PyMuPDF yields per-page text plus offsets, so later stages can point at exact spans without re-parsing the file.</p>
        <h2 id="ex-2">Scanned documents</h2>
        <p>Image-only PDFs raise <code>ScannedDocumentError</code> instead of silently returning nothing, so callers can route them to OCR.</p>
        `
    },
    detection: {
        crumb: 'API Guides',

/* ---------- render section ---------- */
function renderSection(id) {
    const data = CONTENT[id];
    if (!data) return;

    document.getElementById('content').innerHTML =
        '<section data-section>' +
            '<p class="text-[13px] font-medium text-[#C8FF00] mb-2">' + data.crumb + '</p>' +
            '<div class="flex items-start justify-between gap-6 mb-2">' +
                '<div>' +
                    '<h1 class="text-[40px] leading-[1.1] font-bold tracking-[-0.03em] text-ink">' + data.title + '</h1>' +
                    '<p class="text-[17px] text-inksoft mt-3">' + data.sub + '</p>' +
                '</div>' +
                '<div class="relative shrink-0 mt-1.5">' +
                    '<div class="flex items-stretch">' +
                        '<button class="copy-link flex items-center gap-2 h-9 pl-3 pr-3 rounded-l-full border border-line bg-soft text-[13px] text-inksoft hover:text-ink">' + ic('copy', 'text-[15px]') + '<span>Copy page</span></button>' +
                        '<button id="copy-menu-btn" class="h-9 px-2 rounded-r-full border border-l border-line bg-soft text-inksoft hover:text-ink">' + ic('chevrondown', 'text-[15px]') + '</button>' +
                    '</div>' +
                    '<div id="copy-menu" class="menu-pop hidden">' +
                        '<button data-menu="copy">' + ic('copy', 'text-[15px]') + '<span>Copy page</span></button>' +
                        '<button data-menu="md">' + ic('doc', 'text-[15px]') + '<span>View as Markdown</span></button>' +
                        '<button data-menu="ask">' + ic('sparkle', 'text-[15px]') + '<span>Open in Assistant</span></button>' +
                    '</div>' +
                '</div>' +
            '</div>' +
            '<div class="prose mt-7">' + data.body + '</div>' +
        '</section>';

    document.querySelectorAll('.navitem').forEach(b => b.classList.toggle('active', b.dataset.goto === id));
    const tabOwner = { extraction: 'docs', detection: 'docs', checksums: 'docs', ner: 'docs', limits: 'docs', authentication: 'docs', parameters: 'docs', errors: 'docs', responses: 'docs', versioning: 'docs', changelog: 'docs', docker: 'cli', batch: 'cli', playground: 'api', cookbook: 'cookbook' };
    const activeTab = tabOwner[id] || id;
    document.querySelectorAll('.tablink').forEach(t => t.classList.toggle('active', t.dataset.goto === activeTab));

    renderToc(data.toc);
    bindDynamic();
    paintIcons();
    try { history.replaceState(null, '', '#' + id); } catch (e) {}
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderToc(items) {
    document.getElementById('toc').innerHTML = (items || []).map(t =>
        '<a href="#' + t.id + '" data-toc="' + t.id + '" class="' + (t.level ? 'sub ' : '') + (t.active ? 'active' : '') + '">' + t.label + '</a>'
    ).join('');
    document.querySelectorAll('[data-toc]').forEach(a => {
        a.addEventListener('click', (e) => {
            e.preventDefault();
            document.querySelectorAll('[data-toc]').forEach(x => x.classList.remove('active'));
            a.classList.add('active');
            const t = document.getElementById(a.dataset.toc);
            if (t) t.scrollIntoView({ behavior: 'smooth' });
        });
    });
}

/* ---------- dynamic bindings per section ---------- */
function bindDynamic() {
    document.querySelectorAll('#content .copy-link').forEach(btn => {
        btn.addEventListener('click', () => {
            navigator.clipboard.writeText(window.location.href).catch(() => {});
            const label = btn.querySelector('span');
            if (label) { const p = label.textContent; label.textContent = 'Copied!'; setTimeout(() => label.textContent = p, 1400); }
        });
    });

    document.querySelectorAll('.cb-copy').forEach(btn => {
        btn.addEventListener('click', () => {
            const fig = btn.closest('.codeblock');
            navigator.clipboard.writeText(decodeURIComponent(fig.dataset.code || '')).catch(() => {});
            const prev = btn.innerHTML;
            btn.innerHTML = ic('check', 'text-[15px]');
            paintIcons();
            setTimeout(() => { btn.innerHTML = prev; }, 1400);
        });
    });

    const menuBtn = document.getElementById('copy-menu-btn');
    const menu = document.getElementById('copy-menu');
    if (menuBtn && menu) {
        menuBtn.addEventListener('click', (e) => { e.stopPropagation(); menu.classList.toggle('hidden'); });
        menu.querySelectorAll('[data-menu]').forEach(b => b.addEventListener('click', () => { menu.classList.add('hidden'); flashCopy(b); }));
    }

    const pgRun = document.getElementById('pg-run');
    if (pgRun) {
        let mapping = {};
        pgRun.addEventListener('click', () => {
            const text = document.getElementById('pg-input').value;
            if (!text.trim()) return;
            mapping = {};
            let out = text, n = 0;
            const sub = (re, label) => { out = out.replace(re, (m) => { n++; const ph = '[' + label + '_' + n + ']'; mapping[ph] = m; return ph; }); };
            sub(/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/g, 'EMAIL');
            sub(/\b[A-Z]{2}\d{2}(?:[ ]?[A-Z0-9]{4}){1,6}(?:[ ]?[A-Z0-9]{1,4})?\b/g, 'IBAN');
            sub(/\b(?:\d[ -]?){13,16}\b/g, 'CARD');
            sub(/\b\d{3}-\d{2}-\d{4}\b/g, 'SSN');
            sub(/(?:\+1[\s.-]?)?(?:\(\d{3}\)|\d{3})[\s.-]?\d{3}[\s.-]?\d{4}/g, 'PHONE');
            sub(/\b(?:\d{4}-\d{2}-\d{2}|(?:0[1-9]|1[0-2])\/(?:0[1-9]|[12]\d|3[01])\/\d{4})\b/g, 'DATE');
            sub(/\b\d{5}(?:-\d{4})?\b/g, 'ZIP');
            out = out.replace(/\b([A-Z][a-z]+)\s([A-Z][a-z]+)\b/g, (m) => { n++; const ph = '[PERSON_' + n + ']'; mapping[ph] = m; return ph; });
            out = out.replace(/\b([A-Z][A-Za-z]+(?:\s[A-Z][A-Za-z]+)*)\s(Inc|Corp|LLC|Ltd|GmbH|Labs|Group)\b/g, (m) => { n++; const ph = '[ORG_' + n + ']'; mapping[ph] = m; return ph; });
            document.getElementById('pg-output').textContent = out;
            document.getElementById('pg-count').textContent = n;
            document.getElementById('pg-stats').classList.remove('hidden');
            document.getElementById('pg-map').textContent = JSON.stringify(mapping, null, 2);
            document.getElementById('pg-map-wrap').classList.remove('hidden');
            document.getElementById('pg-restore').disabled = false;
        });
        document.getElementById('pg-restore').addEventListener('click', () => {
            let t = document.getElementById('pg-output').textContent;
            Object.entries(mapping).forEach(([k, v]) => { t = t.split(k).join(v); });
            document.getElementById('pg-output').textContent = t;
            document.getElementById('pg-restore').disabled = true;
        });
    }
}

function flashCopy(btn) {
    const label = btn.querySelector('span');
    const prev = label.textContent;
    label.textContent = 'Copied!';
    navigator.clipboard.writeText(window.location.href).catch(() => {});
    setTimeout(() => { label.textContent = prev; }, 1400);
}

/* ---------- global copy-link (TOC) ---------- */
document.querySelectorAll('.copy-link').forEach(btn => {
    btn.addEventListener('click', () => {
        navigator.clipboard.writeText(window.location.href).catch(() => {});
        const label = btn.querySelector('span');
        if (label) { const p = label.textContent; label.textContent = 'Copied!'; setTimeout(() => label.textContent = p, 1400); }
    });
});

/* ---------- navigation ---------- */
document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-goto]');
    if (t) { e.preventDefault(); renderSection(t.dataset.goto); return; }
    const menu = document.getElementById('copy-menu');
    if (menu && !menu.classList.contains('hidden') && !e.target.closest('#copy-menu-btn')) menu.classList.add('hidden');
});

/* ---------- search ---------- */
const SEARCH_INDEX = Object.entries(CONTENT).map(([id, c]) => ({ id, title: c.title, crumb: c.crumb, text: (c.title + ' ' + c.sub + ' ' + c.crumb).toLowerCase() }));
const searchModal = document.getElementById('search-modal');
const searchInput = document.getElementById('search-input');
const searchResults = document.getElementById('search-results');
function openSearch() { searchModal.classList.remove('hidden'); searchModal.classList.add('flex'); searchInput.value = ''; renderResults(''); searchInput.focus(); }
function closeSearch() { searchModal.classList.add('hidden'); searchModal.classList.remove('flex'); }
function renderResults(q) {
    const term = q.trim().toLowerCase();
    const hits = SEARCH_INDEX.filter(i => !term || i.text.includes(term));
    if (!hits.length) { searchResults.innerHTML = '<div class="text-inkdim p-3 text-center text-xs">No matches for "' + q + '"</div>'; return; }
    searchResults.innerHTML = hits.map(h =>
        '<button data-goto="' + h.id + '" class="w-full text-left px-3 py-2.5 rounded-lg hover:bg-surface flex items-center justify-between gap-3">' +
        '<span><span class="block text-ink text-sm">' + h.title + '</span><span class="block text-xs text-inkdim mt-0.5">' + h.crumb + '</span></span>' +
        ic('chevron', 'text-[15px]') + '</button>'
    ).join('');
    searchResults.querySelectorAll('button').forEach(b => b.addEventListener('click', () => { closeSearch(); renderSection(b.dataset.goto); }));
    paintIcons();
}
document.getElementById('search-btn').addEventListener('click', openSearch);
document.getElementById('search-close').addEventListener('click', closeSearch);
searchModal.addEventListener('click', (e) => { if (e.target === searchModal) closeSearch(); });
searchInput.addEventListener('input', (e) => renderResults(e.target.value));
document.getElementById('assistant-btn').addEventListener('click', () => document.getElementById('ask-input').focus());
document.getElementById('ask-send').addEventListener('click', () => { const i = document.getElementById('ask-input'); if (i.value.trim()) i.value = ''; });

document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openSearch(); }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'i') { e.preventDefault(); document.getElementById('ask-input').focus(); }
    if (e.key === 'Escape') closeSearch();
});

/* ---------- boot ---------- */
paintIcons();
const initial = (location.hash || '').replace('#', '');
renderSection(CONTENT[initial] ? initial : 'api');
</script>
