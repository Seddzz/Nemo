[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anonymizer"
version = "0.1.0"
description = "Local PII anonymization engine for the Nemo localhost web app"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Seddzz"}]
requires-python = ">=3.11"
dependencies = [
    "pymupdf",
    "transformers>=5.19",
    "torch",
    "faker",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
    "hypothesis",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".hf-cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "T20"]

[tool.ruff.lint.isort]
known-first-party = ["anonymizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --tb=short"
