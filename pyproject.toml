[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anonymizer"
version = "0.1.0"
description = "API-first anonymization service for English documents (REST, CLI, MCP)"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Seddzz"}]
requires-python = ">=3.11"
dependencies = [
    "pymupdf",
    "transformers",
    "torch",
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "mcp[cli]",
    "typer",
    "faker",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
    "hypothesis",
    "httpx",
]

[project.scripts]
anon = "anonymizer.cli:app"
nemo = "anonymizer.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "T20"]

[tool.ruff.lint.per-file-ignores]
"src/anonymizer/cli.py" = ["T201"]
"eval/*" = ["T201"]

[tool.ruff.lint.isort]
known-first-party = ["anonymizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --tb=short"